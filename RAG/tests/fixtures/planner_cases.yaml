# PLANNER TEST CASES — questions only.
#
# NOT A GOLDEN SET. No expected answers, no expected chunks, no ground-truth
# passages. These test what the planner DECIDES, not what retrieval FINDS, so
# nothing here can leak into retrieval tuning. The golden set stays deferred.
#
# `tags` name the signals a case contains, so a test can assert an invariant
# ("a named jurisdiction is never dropped") without pinning a facet count that
# is still an open design decision.

