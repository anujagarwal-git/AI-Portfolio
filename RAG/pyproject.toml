[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    # --- direct dependencies of regrag/ -------------------------------------
    # Declared explicitly even though langchain currently pulls all three in
    # transitively. registry.py imports yaml and pydantic directly; without
    # these lines a langchain bump that drops either would break the registry
    # loader with an error that looks unrelated to the change that caused it.
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    # generation/llm.py talks to Ollama over raw HTTP. langchain pulls
    # requests in transitively today; declared so a langchain bump that
    # drops it does not break generation with an unrelated-looking error.
    "requests>=2.32,<3",
    # ------------------------------------------------------------------------
    # --- observability (Stage 10) -------------------------------------------
    # CLIENT side only. The Phoenix SERVER runs in docker-compose. This package
    # is the OTel tracer plus the OTLP exporter that ships spans to it, and it
    # supplies start_as_current_span(..., openinference_span_kind="retriever"),
    # which is what makes Phoenix render a retrieval view instead of a text
    # blob. Nothing in regrag/ may import it at module scope - see
    # regrag/observability/tracing.py when it exists.
    "arize-phoenix-otel>=0.16,<1",
    # ------------------------------------------------------------------------
    "docling>=2.113.0",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-experimental>=0.3,<0.4",
    "langchain-huggingface>=0.1,<0.2",
    "langchain-ollama>=0.3.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
    "qdrant-client>=1.18.0",
    "ragas==0.2.15",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.51.0",
    # --- CPU-only PyTorch (2026-10-03, for the Docker image) -----------------
    # Not imported by regrag directly: sentence-transformers and Docling pull it
    # in. Declared here ONLY so [tool.uv.sources] below can route it to the CPU
    # index - uv applies sources to direct dependencies only. Without this, a
    # Linux install pulls the CUDA build (nvidia-* packages, several GB) that a
    # CPU-only project never uses. Versions match what uv.lock already had.
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["regrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".ipynb_checkpoints", ".venv", "qdrant_storage", "data"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
