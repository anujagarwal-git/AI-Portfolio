      AXIS 1 OVERLAP ZONE — WHY `subject` IS A FAN-OUT AXIS, NOT A FILTER.
      CRE36 section 8 is titled "Validation of internal estimates" (36.122:
      "Banks must have a robust system in place to validate the accuracy and
      consistency of..."). So model validation appears on BOTH sides of axis 1:
      as a risk-management discipline in SR 26-2 / SS1/23, and as a CAPITAL
