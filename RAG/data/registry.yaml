    authority_rank: 3
    source_url: https://www.bankofengland.co.uk/prudential-regulation/publication/2023/may/model-risk-management-principles-for-banks-ss
    notes: >
      Model risk management principles for banks. 30 pages.
      SINGLE POINT OF FAILURE FOR AXIS 2 — the only non-US, non-GLOBAL document
      in the corpus. If it parses badly the entire US-vs-UK comparison story has
      no evidence behind it. Parse and inspect it early.
      Published 17 May 2023 as part of PS6/23; the five principles came into
      effect 17 May 2024. PUBLICATION != EFFECTIVE, a one-year gap, and using
      the wrong one silently mis-answers any "was this in force when..."
      question. effective_from holds the operative date.
      Applies to UK-incorporated banks, building societies and PRA-designated
      investment firms WITH internal model approval for regulatory capital.
      This is a REAL scope limit from the statement itself, which is why
      applicability is populated here and null on the two SR rows.
      Narrower than SR 26-2's population, so a US-vs-UK comparison is never
      strictly like-for-like — worth saying out loud in the answer.
      NOT a UK implementation of SR 11-7: independently drafted, different
      vocabulary. Aligns to SR 26-2 concept-to-concept, never clause-to-clause.
      Hence a concept crosswalk rather than a clause map.
    verified: true

