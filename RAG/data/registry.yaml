      a bank may use IRB at all. Same words, different consequence.
      Scoping a validation query to MODEL_RISK_MANAGEMENT silently DELETES the
      CRE36 half of the answer. The user sees a fluent, well-cited, complete-
      looking response with no signal that half the requirement is missing.

      DENSITY WARNING: SR 11-7 has ~101 "validat*" hits in 21 pages; CRE has
      ~39 in 323. Per page, MRM text is roughly 25x denser in the vocabulary of
      a validation query, so CRE loses on raw similarity even when relevant —
      the axis collapses on its own with no filter involved. Per-facet quota is
      what forces CRE36 into context. Note that quota LOWERS context_precision
      and RAISES context_recall; a precision-only gate cannot see one-sided
      retrieval at all, because precision is computed only over what WAS
      retrieved and is structurally blind to absence.

      CRE20's headnote is direct evidence that d424 is already absorbed.
      27 chapters. Stamps: 01 Jan 2023 (x22), 15 Dec 2019 (x5).
      LIVING TEXT — generated from the BIS site 04 Aug 2026.
