# =============================================================================
# DOCUMENT REGISTRY — RAG Regulatory Assistant
# =============================================================================
# One entry per source file. These fields are DENORMALISED onto every chunk's
# Qdrant payload, because filtering happens at the chunk level.
#
# NOTHING HERE CAN BE INFERRED BY A PARSER. Every field below is a curated
# regulatory fact. A wrong `status` or `effective_from` silently poisons every
# downstream answer while the system keeps sounding confident. Treat this file
# as the highest-risk artefact in the project.
#
# RULE: `verified: false` rows are REFUSED BY THE INDEXER (see regrag/
# registry.py). Verification is a gate, not a good intention.
#
# PRINCIPLE: every corpus change must be a DATA change, never a CODE change.
# Adding a jurisdiction or framework adds filter VALUES here, never new code.
# =============================================================================
schema_version: 4

# --- CONTROLLED VOCABULARIES --------------------------------------------------
# subject          : MODEL_RISK_MANAGEMENT | CAPITAL_ADEQUACY | CREDIT_IMPAIRMENT
#                    | DATA_QUALITY | STRESS_TESTING
# framework        : US_MRM_GUIDANCE | UK_MRM_SS | BASEL_FRAMEWORK | IFRS_9
#                    | BCBS_239 | BCBS_STRESS_PRINCIPLES | BCBS_PROBLEM_ASSETS
#                    | REG_Y | REG_YY | US_CAPITAL_PLANNING_GUIDANCE | DFAST
# jurisdiction     : US | UK | EU | IN | GLOBAL
# issuer           : FED | OCC | FDIC | US_INTERAGENCY | PRA | BCBS | EBA
#                    | ECB | IASB | FASB | RBI
# doc_type         : rule | supervisory_guidance | supervisory_statement
#                    | standard | guideline | consultation | draft | faq
#                    | reference_data
# doc_role         : consolidated | amending | standalone
# status           : in_force | partially_revised | superseded | draft
#                    | consultation | withdrawn
# applicability    : ALL | GSIB | US_CATEGORY_I | US_CATEGORY_II_III
#                    | US_CATEGORY_I_TO_IV | UK_INTERNAL_MODEL_FIRMS | null
#
# -----------------------------------------------------------------------------
# `standard` vs `guideline` — NEW IN v4, AND LOAD-BEARING.
#
# BCBS publishes standards and guidelines as SEPARATE publication sets. The
# consolidated Basel Framework contains standards + FAQs only; guidelines and
# sound-practice papers live outside it. The distinction is visible on the
# cover page and in the verbs:
#   standard  (CAP/CRE/LEX/RBC/SCO/SRP32) -> "banks must"
#   guideline (d403 PAP, d450)            -> "banks should", "These guidelines"
#
# `requirement_lookup` MUST filter to doc_type IN (standard, rule).
# A guideline retrieved as a requirement turns "should" into "must" — the
# answer is fluent, cited, and wrong about the one thing that matters.
#
# -----------------------------------------------------------------------------
# `applicability` — ONLY LEGALLY OPERATIVE THRESHOLDS, NEVER EDITORIAL ONES.
#
# v4 removed US_OVER_30BN and US_OVER_1BN. Both came from soft language —
# the Fed calling SR 26-2 "most relevant to" firms over $30bn, and the FDIC
# saying SR 11-7 is "not expected to pertain" below $1bn "unless model use is
# significant, complex, or poses elevated risk". Neither is a scope boundary.
# Encoding them as filter values meant a query about a $20bn firm would
# EXCLUDE the current US model risk guidance outright — a silent wrong answer
# produced by metadata, not by retrieval.
# Both rows now carry `applicability: null`, meaning always eligible.
# A value belongs here only if a document's own text or rule limits its scope.
#
# -----------------------------------------------------------------------------
# `subject` AND `framework` ARE ORTHOGONAL, NOT PARENT-CHILD.
#
#   subject   = WHAT the document is about.
#   framework = WHICH INSTRUMENT it is — the identity that PERSISTS ACROSS
#               VERSIONS.
#
# The relationship is many-to-many and a tree cannot hold it:
#   BASEL_FRAMEWORK spans CAPITAL_ADEQUACY *and* STRESS_TESTING (SRP32).
#   STRESS_TESTING spans BCBS *and* the Federal Reserve.
# Whichever you made the parent, the other became unaskable. So neither is.
#
# THE RULE FOR `framework`: two documents share a framework key if and only if
# one could REPLACE the other, or they are variants of the same instrument.
# SR 11-7 and SR 26-2 are two versions of ONE framework, so they share
# US_MRM_GUIDANCE. Before v3 they had different keys, which meant axis 3 had
# NO FIELD TO FILTER ON — "give me the current US MRM guidance" required
# already knowing the answer. Now it is one facet:
#     (framework=US_MRM_GUIDANCE, status=in_force)   -> SR 26-2
#     (framework=US_MRM_GUIDANCE, status=superseded) -> SR 11-7
#
# AXIS -> FIELD MAP (each axis filters on exactly one field):
#   Axis 1 Framework    -> `subject`                 FAN-OUT (subjects overlap)
#   Axis 2 Jurisdiction -> `jurisdiction`            FILTER  (exclusive)
#   Axis 3 Version      -> `framework` + `status`    FILTER  (exclusive)
#
# -----------------------------------------------------------------------------
# `volume` — SUBDIVISION-ONLY RULE (v4).
# Populate ONLY when the document is a subdivision of something larger; null
# when the document IS the framework. So CAP/CRE/LEX/RBC/SCO/SRP32 carry their
# chapter code and 225.8 carries its section number, but Part 252 does not —
# framework REG_YY *is* Part 252, and two fields stating one fact is a bug
# waiting for someone to edit one of them.
# This makes "is `volume` present?" a signal the planner can read.
#
# `short_name` — the canonical citation string, on every row.
# Six rows cannot be named from any other structured field, because their
# `framework` is a shared version-family key (US_MRM_GUIDANCE,
# US_CAPITAL_PLANNING_GUIDANCE, DFAST) and their `volume` is null. Without a
# curated name, the generator must prettify a doc_id slug or invent a title —
# and an invented title attached to a CORRECT quotation is unfalsifiable from
# the output. Populated on all rows for consistency, not only where required.
#
# -----------------------------------------------------------------------------
# authority_rank (0-5) — how much weight a clause carries in a conflict.
#   5 = binding law/rule in its jurisdiction  (e.g. 12 CFR, EU CRR)
#   4 = binding supervisory requirement
#   3 = supervisory guidance / expectations   (SR letters, PRA SS)
#   2 = international standard or guideline, NOT binding until a jurisdiction
#       adopts it
#   1 = draft / consultation — NEVER binding
#   0 = reference data — factual output, states no requirement at all.
#       NEVER retrievable for a requirement question.
#
# `doc_role` decides whether ONE document can settle a question.
#   consolidated — self-contained current text; a single hit can answer.
#   amending     — edits another document; meaningless alone. Extraction
#                  destroys strikethrough, so deleted+added text merges into
#                  nonsense ("both all"). SEMANTIC INVERSION, not noise.
#   standalone   — self-contained, never amended.
#
# `revises` / `revised_by` are SEPARATE from `supersedes` / `superseded_by`.
#   Partial revision leaves the old text standing in the untouched parts.
#   Supersession replaces it wholesale. Collapsing the two is how a system
#   ends up citing dead text as current.
# -----------------------------------------------------------------------------
#
# STILL OPEN — raised, not yet closed (do not treat silence as settled):
#   1. `DFAST` collision — scenarios and results share framework, status,
#      subject and applicability with nothing structural separating them.
#      ACCEPTED: both are authority_rank 0 and already excluded from every
#      requirement question.
#   2. IFRS 9 is indexed as a deliberate credit-risk extract with NO declared
#      scope (decision: no `covers` field). The system therefore cannot
#      distinguish "IFRS 9 is silent on X" from "our copy omits X".
#      ACCEPTED AND UNDOCUMENTED IN DATA — see that row's notes.
#   3. CODE TASK — `generation/prompts.py` must build citations from
#      `short_name` + `volume` + `status` + `effective_from`. There is no
#      free-text citation field; if prompts.py passes doc_id through, the
#      audit trail degrades to slugs.
#   4. CODE TASK — the Basel chapter-stamp parser does not exist yet, and the
#      five multi-chapter Basel files CANNOT BE INDEXED until it does, because
#      their `effective_from` is chapter-level. LEX (22pp, 4 chapters) is the
#      smallest test target.
#   5. Living-text staleness is a MANUAL discipline (no `snapshot_date` field).
#      Rendering dates survive only in notes: 225.8 = 06 Aug 2026,
#      Part 252 = 07 Aug 2026, Basel CAP/CRE/LEX/RBC = 04 Aug 2026,
#      SCO/SRP32 = 10-11 Aug 2026.
# =============================================================================

# =============================================================================
# KNOWN GAPS — instruments the corpus REFERENCES but does not HOLD.
#
# Not documents. Zero vectors, zero embedding cost. Their only job is to let a
# refusal be specific: "that provision lives in an instrument we don't hold"
# instead of a bare "I don't know". A refusal that names the gap is auditable;
# one that doesn't is indistinguishable from a retrieval failure.
# =============================================================================
known_gaps:

  - instrument: 12 CFR 217
    short_name: 12 CFR 217
    title: Regulatory Capital Rules (Regulation Q)
    jurisdiction: US
    issuer: FED
    referenced_by: [cfr-12-252, cfr-12-225-8]
    sections_referenced: ["217.2", "217.3", "217.10", "217.11", "217.20",
                          "217.36", "217.37", "217.132", "217.400", "217.402",
                          "217.403", "217.406"]
    sections_basis: >
      Extracted from the corpus itself — every "12 CFR 217.x" cross-reference
      appearing in 12 CFR Part 252 and 12 CFR 225.8. Most frequent: 217.2
      (28 references), 217.402 (9), 217.11 (9 across both documents).
    reason_absent: >
      Deliberately not acquired (2026-08-12). ~250 pages against a current
      corpus of ~1,100, and the CCAR chain can be demonstrated without it.
    consequence: >
      THE CET1 CHAIN IS BROKEN AT THE LAST LINK. Part 252 defines CET1 only by
      cross-reference: "Common equity tier 1 capital has the same meaning as in
      12 CFR 217.20(b)". So no capital REQUIREMENT and no distribution limit
      can be answered from this corpus. Two documents will look like they
      answer it and neither does: Basel RBC states "Common Equity Tier 1 must
      be at least 4.5% of RWA" (authority_rank 2 — binds nobody in the US), and
      the 2026 DFAST results table contains the numeral 4.5 (authority_rank 0 —
      an outcome, not a requirement). A pipeline ignoring authority_rank gets
      false corroboration from both at once.
    refusal: >
      The provision you are asking about is set out in 12 CFR 217 (Regulation
      Q), which is cross-referenced by 12 CFR Part 252 and 12 CFR 225.8 but is
      not held in this corpus. It cannot be answered from these sources. Note
      that the Basel minimum (RBC) is not a US requirement, and stress test
      results are outcomes rather than requirements.

# =============================================================================
# AXIS 1 — FRAMEWORK : model risk vs Basel capital        -> `subject`
# AXIS 2 — JURISDICTION : SR 26-2 (US) vs SS1/23 (UK)     -> `jurisdiction`
# AXIS 3 — VERSION : SR 11-7 -> SR 26-2                   -> `framework`+`status`
#
# CONCENTRATION RISK: axes 2 and 3 both live inside MODEL_RISK_MANAGEMENT, on
# three documents. Worse, the corpus holds exactly ONE UK document — axis 2
# rests on a single file. If SS1/23 fails to parse, axis 2 produces nothing.
# A free second eCFR as-of-date snapshot of Part 252 would have given axis 3 a
# second pair; DECLINED 2026-08-12, so the fragility is accepted knowingly.
# =============================================================================

documents:

# -----------------------------------------------------------------------------
# MODEL RISK MANAGEMENT — carries axis 2 (US vs UK) and axis 3 (version)
# -----------------------------------------------------------------------------

  - doc_id: sr-26-2-2026
    short_name: SR 26-2
    file: data/MRM/SR-26-2_attachment.pdf
    subject: MODEL_RISK_MANAGEMENT
    framework: US_MRM_GUIDANCE      # SHARED with sr-11-7-2011 — this is axis 3
    volume: null
    jurisdiction: US
    issuer: US_INTERAGENCY          # PDF header: Board of Governors + FDIC + OCC
    doc_type: supervisory_guidance
    doc_role: consolidated
    effective_from: 2026-04-17      # dated on the attachment's own first page
    effective_to: null
    status: in_force
    supersedes: [sr-11-7-2011]      # ALSO supersedes SR 21-8 (BSA/AML), not in corpus
    superseded_by: []
    revises: []
    revised_by: []
    applicability: null             # v4: "most relevant to $30bn+" is editorial, not scope
    authority_rank: 3
    source_url: https://www.federalreserve.gov/supervisionreg/srletters/SR2602.htm
    notes: >
      Revised interagency guidance on model risk management. Issued 17 Apr 2026
      by the Federal Reserve, OCC and FDIC jointly; all three agencies appear in
      the attachment header, so US_INTERAGENCY is correct here in a way it is
      NOT for SR 11-7 (see that row).
      Supersedes BOTH SR 11-7 (2011) and SR 21-8 (2021, BSA/AML model risk) —
      which is why `supersedes` is a LIST. Only SR 11-7 is in this corpus, so
      only it appears above; do not "tidy" this to a scalar.

      MODEL DEFINITION — VERIFIED VERBATIM FROM THIS PDF (2026-08-12):
        "For the purposes of this guidance, the term 'model' refers to a COMPLEX
         quantitative method, system, or approach that applies statistical,
         economic, or financial theories to process input data into quantitative
         estimates. The term 'model' in this guidance EXCLUDES simple arithmetic
         calculations, such as those found within spreadsheets, as well as
         deterministic rule-based processes and software where there are no
         statistical, economic, or financial theories underpinning their design
         or use."
      Prior secondary-commentary caveat REMOVED — the claim checked out, and
      two further changes it had missed are recorded on the sr-11-7 row.
    verified: true

  - doc_id: sr-11-7-2011
    short_name: SR 11-7
    file: data/MRM/SR-11-7_ModelRiskMgmt_2011.pdf
    subject: MODEL_RISK_MANAGEMENT
    framework: US_MRM_GUIDANCE      # SHARED with sr-26-2-2026 — this is axis 3
    volume: null
    jurisdiction: US
    issuer: US_INTERAGENCY          # IMPRECISE BY DECISION — see notes
    doc_type: supervisory_guidance
    doc_role: consolidated
    effective_from: 2011-04-04
    effective_to: 2026-04-17
    status: superseded
    supersedes: []
    superseded_by: [sr-26-2-2026]
    revises: []
    revised_by: []
    applicability: null             # v4: FDIC's "$1bn unless significant" is conditional, not scope
    authority_rank: 3
    source_url: https://www.federalreserve.gov/supervisionreg/srletters/sr1107.htm
    notes: >
      Original 2011 guidance on model risk management.
      MUST NEVER appear in a default (in_force) answer. Indexed only so that
      "what changed?" questions work and the audit trail can show prior text.

      MODEL DEFINITION — VERIFIED VERBATIM FROM THIS PDF (2026-08-12):
        "For the purposes of this document, the term model refers to a
         quantitative method, system, or approach that applies statistical,
         economic, financial, or MATHEMATICAL theories, TECHNIQUES, AND
         ASSUMPTIONS to process input data into quantitative estimates."

      WHAT CHANGED IN SR 26-2 — four differences, all verified from both PDFs:
        1. "complex" qualifier ADDED
        2. explicit EXCLUSION of simple arithmetic and deterministic
           rule-based processes ADDED
        3. "mathematical" theories DROPPED from the list
        4. "techniques, and assumptions" DROPPED
      Items 3 and 4 were NOT in the secondary commentary and were found only by
      reading both texts.

      *** THE SPREADSHEET REVERSAL — BEST GOLDEN QUESTION IN THE CORPUS ***
      This document says: "User-developed applications, such as SPREADSHEETS or
      ad hoc database applications used to generate quantitative estimates, are
      PARTICULARLY PRONE TO MODEL RISK."
      SR 26-2 excludes "simple arithmetic calculations, such as those found
      within spreadsheets."
      Be precise: this is not a blanket reversal — a spreadsheet running a
      regression is still a model under SR 26-2. But on SIMPLE spreadsheet
      calculations the two versions point in opposite directions.
      "Are spreadsheets in scope for model risk management?" therefore has a
      DIFFERENT CORRECT ANSWER PER VERSION, both quotable. A version-bleed
      failure produces a confident, well-cited, inverted answer — a stronger
      trap than golden question sr-01, because the failure is a reversal rather
      than a drift.

      ISSUER IS IMPRECISE AND DELIBERATELY SO (decision 2026-08-12). The 2011
      attachment header lists only the Federal Reserve and the OCC — not the
      FDIC. The FDIC adopted the same guidance with technical conforming
      changes on 07 Jun 2017 via FIL-22-2017. So "US_INTERAGENCY" is true of
      the guidance TODAY and false of this document AT ISSUANCE. A FED_OCC
      vocabulary value was considered and declined; the nuance lives here and
      cannot be filtered on.
    verified: true

